packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  cypress: true
  prisma: true
  simple-git-hooks: false
  unrs-resolver: false
# Correções de segurança de dependências transitivas (pnpm audit --audit-level=high, 08-seguranca § 11).
# Remover cada linha quando a dependência direta passar a trazer a versão corrigida.
overrides:
  multer: '>=2.3.0'
  postcss: '>=8.5.23'
  deepmerge-ts: '>=8.0.0'
