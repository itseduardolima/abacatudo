# Overlay para quando esta VPS já roda outro app dono das portas 80/443 (aqui: o pdv-web, mesma máquina).
# Uso: docker compose -f docker-compose.yml -f docker-compose.shared-caddy.yml up -d --build web api
# (nunca inclui o serviço `caddy` no comando — ele nem sobe, evita o conflito de porta). O Caddy do
# outro app aponta pra cá pelo nome do container nessa rede externa (ver Caddyfile dele).
services:
  web:
    networks:
      - default
      - shared_caddy
  api:
    networks:
      - default
      - shared_caddy

networks:
  shared_caddy:
    external: true
    # Nome real da rede default do projeto docker compose que já possui o Caddy — ajuste se o nome do
    # outro projeto mudar (docker network ls).
    name: pdv-web_default
